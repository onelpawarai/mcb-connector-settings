<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="MCB Connector Settings — ধাপে ধাপে ফর্ম, প্রতিটি বাটন একটি সিস্টেম, বিল্ট-ইন 60/30 FPS স্ক্রিন রেকর্ডার।">
<meta name="theme-color" content="#0b1017">
<title>MCB Connector Settings — ZYRAXON Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffb020'/%3E%3Cpath d='M10 8h13v4h-8.5v3.5H22v4h-7.5V24H10z' fill='%230b1017'/%3E%3C/svg%3E">
</head>
<body>

<div class="app">

  <header class="topbar">
    <a class="brand" href="#/home">
      <div class="brand-mark">MCB</div>
      <div class="brand-txt">
        <b data-i18n="brand.name">কানেক্টর সেটিংস</b>
        <span data-i18n="brand.sub">ZYRAXON Lab · Electrical</span>
      </div>
    </a>

    <nav class="nav" id="nav">
      <a class="nav-btn on" href="#/home"     data-i18n="nav.home">হোম</a>
      <a class="nav-btn"    href="#/form"     data-i18n="nav.form">ফর্ম</a>
      <a class="nav-btn"    href="#/records"  data-i18n="nav.records">রেকর্ড</a>
      <a class="nav-btn"    href="#/settings" data-i18n="nav.settings">সেটিংস</a>
      <a class="nav-btn"    href="#/about"    data-i18n="nav.about">গাইড</a>
    </nav>

    <div class="topbar-right">
      <div class="chip-live" title="Engine status">
        <i class="dot"></i><span id="liveTxt">ENGINE ONLINE</span>
      </div>
      <button class="btn btn-sm btn-ghost" id="btnLang" data-sys="lang" title="ভাষা পরিবর্তন">
        <span id="langLabel">EN</span>
      </button>
      <button class="btn btn-sm btn-ghost btn-icon" id="btnTheme" data-sys="theme" title="থিম">◐</button>
      <button class="btn btn-sm btn-danger" id="btnRecTop" data-sys="rec.top">
        <span class="dot" style="background:#fff"></span> REC
      </button>
    </div>
  </header>

  <main class="main" id="view"></main>

  <footer class="foot">
    <div class="foot-in">
      <div>
        <b>ZYRAXON Lab</b>
        <p data-i18n="foot.t1">Built by Only Power AI · Owned by OMG (Alex Deluar Husen Sayidi)</p>
      </div>
      <div class="foot-links">
        <button class="linkbtn" data-sys="foot.doc">ডকুমেন্টেশন</button>
        <button class="linkbtn" data-sys="foot.stand">স্ট্যান্ডার্ড</button>
        <button class="linkbtn" data-sys="foot.shortcut">শর্টকাট</button>
        <button class="linkbtn" data-sys="foot.sysinfo">সিস্টেম তথ্য</button>
      </div>
    </div>
  </footer>

</div>

<aside class="rdock" id="rdock">
  <div class="rdock-hd" id="rdockHd">
    <i class="dot" id="rdockDot"></i>
    <b>RECORDER</b>
    <span class="st" id="rdockState">IDLE</span>
    <button class="x" id="rdockClose" title="বন্ধ">×</button>
  </div>
  <div class="rdock-body">
    <video class="rdock-prev" id="rdockPrev" autoplay muted playsinline></video>
    <div class="rdock-metrics">
      <div class="rmet"><span>FPS</span><b id="mFps">60</b></div>
      <div class="rmet"><span>সময়</span><b id="mTime">00:00</b></div>
      <div class="rmet"><span>সাইজ</span><b id="mSize">0 MB</b></div>
    </div>
    <div class="rdock-acts">
      <button class="btn btn-danger btn-sm" id="mRec">● রেকর্ড</button>
      <button class="btn btn-cyan btn-sm" id="mPause" disabled>⏸ থামাও</button>
      <button class="btn btn-ghost btn-sm" id="mStop" disabled>■ শেষ</button>
    </div>
    <div class="rdock-actions">
      <button class="btn btn-ghost btn-sm" id="mSnap">📸 ফ্রেম ধরো</button>
      <button class="btn btn-ghost btn-sm" id="mDown" disabled>⬇ ভিডিও নামাও</button>
    </div>
  </div>
</aside>

<div class="toasts" id="toasts"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-hd">
      <h3 id="modalTitle">—</h3>
      <button class="x" id="modalX">×</button>
    </div>
    <div class="modal-bd" id="modalBody"></div>
    <div class="modal-ft" id="modalFoot"></div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/recorder.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
